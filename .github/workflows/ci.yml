name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v30
      with:
        nix_path: nixpkgs=channel:nixpkgs-unstable
    - name: Lint Code
      run: nix-shell --run "lua-language-server --check ."
    - name: Test Code
      run: nix-shell --run "busted"
